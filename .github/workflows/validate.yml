name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every language pack
        run: python tools/validate.py --strict
      - name: Edge spaces stay in sync with English keys
        run: python tools/fix_edge_spaces.py --dry-run
