<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Menyoo Language Packs — 16 languages, 50 624 strings, 100% UI coverage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea44f" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2ea44f"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2ea44f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2ea44f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="120" cy="60" rx="320" ry="220" fill="url(#glow1)" filter="url(#soft)"/>
  <ellipse cx="1090" cy="350" rx="360" ry="240" fill="url(#glow2)" filter="url(#soft)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#line)"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="104" font-size="20" letter-spacing="6" fill="#7dd3fc" font-weight="600">GTA V · MENYOO TRAINER</text>

    <text x="78" y="180" font-size="62" font-weight="700" fill="url(#title)">Menyoo Language Packs</text>

    <text x="80" y="228" font-size="25" fill="#9fb0c9">16 languages · 50 624 translated strings · 100 % of the interface</text>

    <g font-size="19" font-weight="600">
      <rect x="80" y="268" width="196" height="46" rx="23" fill="#161f31" stroke="#2ea44f" stroke-opacity="0.55"/>
      <text x="178" y="297" fill="#4ade80" text-anchor="middle">100 % coverage</text>

      <rect x="292" y="268" width="212" height="46" rx="23" fill="#161f31" stroke="#3b82f6" stroke-opacity="0.55"/>
      <text x="398" y="297" fill="#93c5fd" text-anchor="middle">3164 / pack</text>

      <rect x="520" y="268" width="150" height="46" rx="23" fill="#161f31" stroke="#a855f7" stroke-opacity="0.55"/>
      <text x="595" y="297" fill="#d8b4fe" text-anchor="middle">MIT</text>

      <rect x="686" y="268" width="238" height="46" rx="23" fill="#161f31" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="805" y="297" fill="#fcd34d" text-anchor="middle">Enhanced &amp; Legacy</text>
    </g>

    <g font-size="19" fill="#64748b">
      <text x="80" y="344">Русский · Deutsch · Français · Español · Italiano · Português · Polski · Українська</text>
      <text x="80" y="374">Čeština · Nederlands · Türkçe · 日本語 · 简体中文 · 繁體中文 · 한국어 · English</text>
    </g>
  </g>
</svg>
